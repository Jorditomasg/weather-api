spring.application.name=weather-api

# Carga .env (formato KEY=VALUE) si existe; en CI/producción se usan variables de entorno reales
spring.config.import=optional:file:.env[.properties]

aemet.api-key=${AEMET_API_KEY}
aemet.base-url=https://opendata.aemet.es/opendata

# Errores en formato estándar RFC 9457 (ProblemDetail)
spring.mvc.problemdetails.enabled=true

# AEMET a veces se queda colgada: sin timeout, cada petición bloquearía un hilo indefinidamente
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=15s

# "Mañana" se calcula en hora peninsular, no en la del servidor (que en la nube suele ser UTC)
prediccion.zona-horaria=Europe/Madrid
