spring.application.name=weather-api

# Loads .env (KEY=VALUE format) if present; CI/production use real environment variables
spring.config.import=optional:file:.env[.properties]

aemet.api-key=${AEMET_API_KEY}
aemet.base-url=https://opendata.aemet.es/opendata

# Errors in standard RFC 9457 format (ProblemDetail)
spring.mvc.problemdetails.enabled=true

# AEMET sometimes hangs: without timeouts every request would block a thread indefinitely
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=15s

# "Tomorrow" is computed in Spanish mainland time, not the server's (usually UTC in the cloud)
forecast.time-zone=Europe/Madrid

# AEMET limits requests per minute and updates forecasts only a few times a day:
# kept in memory and refreshed in the background, serving the stale one if AEMET fails
forecast.cache.refresh-after=30m

# The municipality list barely changes: kept in memory and refreshed in the background
municipality.cache.refresh-after=24h
municipality.cache.warm-up=true
